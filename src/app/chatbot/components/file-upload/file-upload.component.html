<!-- Botón para abrir el popup -->
<div class="max-w-4xl mx-auto p-4">
  <button
    (click)="openUploadModal()"
    class="py-2 px-4 bg-indigo-600 text-white rounded-md shadow hover:bg-indigo-700 transition"
  >
    + Subir documento
  </button>
</div>

<!-- Modal de subida -->
<ng-container *ngIf="isUploadModalOpen">
  <div
    class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50"
  >
    <div class="bg-white rounded-lg shadow-lg w-full max-w-md p-6 relative">
      <!-- Cerrar -->
      <button
        (click)="closeUploadModal()"
        class="absolute top-4 right-4 text-gray-500 hover:text-gray-700"
      >
        ✕
      </button>
      <!-- Formulario de subida -->
      <form
        #fileUploadForm="ngForm"
        (ngSubmit)="onSubmit(fileUploadForm)"
        class="space-y-4 mt-4"
      >
        <div>
          <label
            for="file-upload"
            class="block text-sm font-medium text-gray-700"
          >
            Seleccionar archivo PDF
          </label>
          <input
            id="file-upload"
            type="file"
            accept=".pdf"
            (change)="onFileSelected($event)"
            class="mt-1 block w-full text-sm text-gray-500
                   file:mr-4 file:py-2 file:px-4
                   file:rounded-full file:border-0
                   file:text-sm file:font-semibold
                   file:bg-indigo-50 file:text-dark-700
                   hover:file:bg-indigo-400"
          />
        </div>

        <button
          type="submit"
          [disabled]="loading"
          class="w-full py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none disabled:opacity-50"
        >
          Subir documento
        </button>

        <div *ngIf="loading" class="mt-4 flex justify-center items-center">
          <div
            class="animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-indigo-600"
          ></div>
          <span class="ml-2 text-indigo-600">Subiendo...</span>
        </div>

        <div
          *ngIf="notification"
          [ngClass]="{
            'bg-green-100 text-green-800': notification.type === 'success',
            'bg-red-100 text-red-800': notification.type === 'error'
          }"
          class="p-4 rounded mt-4"
        >
          {{ notification.message }}
        </div>
      </form>
    </div>
  </div>
</ng-container>

<!-- Tabla de documentos cargados -->
<div class="max-w-4xl mx-auto p-4 bg-white rounded-lg shadow mt-6">
  <table class="min-w-full divide-y divide-gray-200">
    <thead class="bg-gray-50">
      <tr>
        <th
          class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
        >
          Documento
        </th>
        <th
          class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider"
        >
          Eliminar
        </th>
      </tr>
    </thead>
    <tbody class="bg-white divide-y divide-gray-200">
      <tr *ngFor="let doc of documents">
        <!-- Muestra la propiedad source -->
        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
          {{ doc.source }}
        </td>
        <td class="px-6 py-4 whitespace-nowrap text-center">
          <button
            (click)="deleteDocument(doc.source)"
            class="inline-flex items-center px-3 py-1 border border-transparent text-sm leading-4 font-medium rounded-md shadow-sm text-white bg-red-600 hover:bg-red-700 focus:outline-none"
          >
            <svg class="h-4 w-4 mr-1" fill="currentColor" viewBox="0 0 20 20">
              <path
                d="M6 2a1 1 0 00-1 1v1H2.5a.5.5 0 000 1H3v11a2 2 0 002 2h10a2 2 0 002-2V5h.5a.5.5 0 000-1H15V3a1 1 0 00-1-1H6zm2 3V3h4v2H8z"
              />
            </svg>
            Eliminar
          </button>
        </td>
      </tr>
      <tr *ngIf="documents.length === 0">
        <td colspan="2" class="px-6 py-4 text-center text-sm text-gray-500">
          No hay documentos cargados.
        </td>
      </tr>
    </tbody>
  </table>
</div>
